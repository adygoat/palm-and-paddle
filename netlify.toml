[build]
  command = "cd backend && npm ci && cd ../frontend && npm ci && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "backend/src/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200